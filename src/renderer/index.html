<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>honeybee</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app" data-view="agents">
    <header class="titlebar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
          <path class="logo-cell" d="M12 2.5 20.2 7.25v9.5L12 21.5 3.8 16.75v-9.5Z"/>
          <path class="logo-stripe" d="M3.8 10.1h16.4M3.8 13.9h16.4"/>
        </svg>
        <span class="wordmark">honeybee</span>
      </div>
      <nav class="tabs" role="tablist" aria-label="View">
        <button class="tab" role="tab" data-tab="agents" aria-selected="true">agents<span class="tab-count" id="tab-count"></span></button>
        <button class="tab" role="tab" data-tab="usage" aria-selected="false">usage</button>
      </nav>
      <div class="controls">
        <button class="control" data-action="settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 5.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8Z"/><path d="M8 1.5v1.6M8 12.9v1.6M14.5 8h-1.6M3.1 8H1.5M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1M12.6 12.6l-1.1-1.1M4.5 4.5 3.4 3.4"/></svg>
        </button>
        <button class="control" data-action="minimize" title="Minimise" aria-label="Minimise">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9"/></svg>
        </button>
        <button class="control" data-action="close" title="Fold into the bubble" aria-label="Close to the bubble">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
        </button>
      </div>
    </header>

    <main class="content">
      <section class="panel agents-panel" data-panel="agents" aria-label="Agents">
        <h2 class="panel-title">agents <span class="panel-meta" id="agents-meta"></span></h2>
        <ol class="sessions" id="sessions"></ol>
        <div class="empty" id="agents-empty" hidden></div>
      </section>

      <section class="panel usage-panel" data-panel="usage" aria-label="Usage">
        <h2 class="panel-title">usage left</h2>
        <div class="providers" id="providers"></div>
      </section>

      <section class="settings" id="settings" hidden aria-label="Settings">
        <div class="settings-head">
          <h2 class="panel-title">settings</h2>
          <button class="text-button" data-action="settings-done">done</button>
        </div>
        <div class="settings-body" id="settings-body"></div>
      </section>
    </main>

    <footer class="statusbar" id="statusbar"></footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
